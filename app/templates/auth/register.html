{% extends "base.html" %}

{% block title %}Create account — DreamCareer{% endblock %}

{% block content %}

<div class="auth-wrap">
    <div class="auth-card">
        <div class="text-center mb-4">
            <span class="brand-mark" style="width:46px;height:46px;font-size:1.3rem;">◆</span>
            <h2 class="mt-3 mb-1">{{ t('Create your account') }}</h2>
            <p class="text-muted mb-0">Free forever. Your CV, decoded.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username"
                       name="username" required autofocus minlength="3" maxlength="150"
                       placeholder="jane_doe">
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email"
                       name="email" required maxlength="150"
                       placeholder="you@example.com">
            </div>

            <div class="row g-3 mb-2">
                <div class="col-md-6">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password"
                           name="password" required minlength="6" placeholder="6+ characters">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="confirm_password">Confirm</label>
                    <input type="password" class="form-control" id="confirm_password"
                           name="confirm_password" required placeholder="Repeat it">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg mt-3">
                Create account
            </button>
        </form>

        <div class="auth-switch">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
        </div>
    </div>
</div>

{% endblock %}
