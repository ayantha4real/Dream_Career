{% extends "base.html" %}

{% block title %}Log in — DreamCareer{% endblock %}

{% block content %}

<div class="auth-wrap">
    <div class="auth-card">
        <div class="text-center mb-4">
            <span class="brand-mark" style="width:46px;height:46px;font-size:1.3rem;">◆</span>
            <h2 class="mt-3 mb-1">{{ t('Welcome back') }}</h2>
            <p class="text-muted mb-0">Log in to continue your career journey.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label" for="identifier">Username or email</label>
                <input type="text" class="form-control" id="identifier"
                       name="identifier" required autofocus
                       placeholder="you@example.com">
            </div>

            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password"
                       name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg">Log in</button>
        </form>

        <div class="auth-switch">
            New here? <a href="{{ url_for('auth.register') }}">Create a free account</a>
        </div>
    </div>
</div>

{% endblock %}
